*, *::before, *::after {
  box-sizing: border-box; margin: 0; padding: 0;
  -webkit-tap-highlight-color: transparent;
}

html {
  height: 100%;
  height: -webkit-fill-available;
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
  overscroll-behavior: none;
}

body {
  width: 100%;
  height: 100%;
  height: -webkit-fill-available;
  background: #000;
  overflow: hidden;
  position: fixed;
  inset: 0;
  overscroll-behavior: none;
}

/* VIDEO - true fullscreen */
#bg-video {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center center;
  filter: brightness(0.5) saturate(0.75);
  z-index: 0;
  pointer-events: none;
  /* Hidden until we KNOW playback has actually started — this keeps
     any native "tap to play" affordance from ever being visible. The
     static #bg-poster image underneath covers the wait. */
  opacity: 0;
  transition: opacity 0.6s ease;
}
#bg-video.is-playing { opacity: 1; }

#bg-poster {
  position: fixed; inset: 0;
  width: 100%; height: 100%;
  object-fit: cover; object-position: center center;
  filter: brightness(0.5) saturate(0.75);
  z-index: 0;
  pointer-events: none;
}

/* Kill every native WebKit/Safari video control & the big central
   "play button" overlay, even though we never set controls="" */
#bg-video::-webkit-media-controls,
#bg-video::-webkit-media-controls-enclosure,
#bg-video::-webkit-media-controls-panel,
#bg-video::-webkit-media-controls-panel-container,
#bg-video::-webkit-media-controls-play-button,
#bg-video::-webkit-media-controls-start-playback-button,
#bg-video::-webkit-media-controls-overlay-enclosure,
#bg-video::-webkit-media-controls-overlay-play-button {
  display: none !important;
  -webkit-appearance: none !important;
  opacity: 0 !important;
  pointer-events: none !important;
}

.grain {
  position: fixed; inset: 0; z-index: 1;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.07'/%3E%3C/svg%3E");
  opacity: 0.4; pointer-events: none; mix-blend-mode: overlay;
}
.vignette {
  position: fixed; inset: 0; z-index: 2;
  background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.75) 100%);
  pointer-events: none;
}

#intro {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  z-index: 10;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding-top: env(safe-area-inset-top);
  padding-bottom: env(safe-area-inset-bottom);
}

.intro-flag {
  width: clamp(70px, 12vw, 110px);
  height: auto;
  opacity: 0; transform: translateY(12px);
  margin-bottom: 20px;
}

.intro-title {
  font-family: 'BlockBerthold', sans-serif;
  font-size: clamp(48px, 12vw, 108px);
  letter-spacing: 0.06em;
  color: #d4af37; line-height: 1;
  opacity: 0; transform: translateY(16px);
  text-align: center;
}



.intro-enter {
  position: absolute;
  bottom: calc(env(safe-area-inset-bottom) + 80px);
  margin-top: 0;
  font-family: 'Special Elite', monospace;
  font-size: 11px;
  letter-spacing: 0.15em;
  color: #d4af37;
  text-transform: lowercase;
  background: transparent; border: none;
  border-bottom: 0.5px solid rgba(212,175,55,0.5);
  padding: 0 2px 2px;
  cursor: pointer;
  opacity: 0; transform: translateY(10px);
  transition: color 0.3s, border-color 0.3s;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
.intro-enter:hover { color: #f0d878; border-bottom-color: #f0d878; }

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(14px); }
  to   { opacity: 1; transform: translateY(0); }
}
.anim-1 { animation: fadeUp 1s ease forwards; animation-delay: 0.4s; }
.anim-2 { animation: fadeUp 1.2s ease forwards; animation-delay: 0.7s; }
.anim-3 { animation: fadeUp 1s ease forwards; animation-delay: 1s; }
.anim-4 { animation: fadeUp 0.8s ease forwards; animation-delay: 3s; }

.legal-links {
  position: fixed;
  left: 0; right: 0;
  bottom: max(16px, env(safe-area-inset-bottom));
  z-index: 11;
  text-align: center;
  font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif;
  font-size: 9px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  pointer-events: none;
}
.legal-links a {
  color: rgba(240,230,200,0.35);
  text-decoration: none;
  margin: 0 6px;
  pointer-events: auto;
  touch-action: manipulation;
}
.legal-links a:hover { color: rgba(212,175,55,0.7); }
body.fading .legal-links { transition: opacity 0.8s ease; opacity: 0; }

<script>
// Start video at a random point, muted+autoplay, no visible controls/play button
(function initBgVideo() {
  const video = document.getElementById('bg-video');
  video.muted = true;
  video.defaultMuted = true;
  video.playsInline = true;

  function attemptPlay() {
    var p = video.play();
    if (p && p.catch) { p.catch(function(){}); }
  }

  attemptPlay();

  function randomStart() {
    if (video.duration && isFinite(video.duration)) {
      video.currentTime = Math.random() * Math.max(video.duration - 1, 0);
    }
    attemptPlay();
  }

  if (video.readyState >= 1) {
    randomStart();
  } else {
    video.addEventListener('loadedmetadata', randomStart, { once: true });
  }

  let lastTime = -1;
  const revealCheck = setInterval(function () {
    if (!video.paused && video.currentTime > 0 && video.currentTime !== lastTime) {
      video.classList.add('is-playing');
      clearInterval(revealCheck);
      clearInterval(retryTimer);
    }
    lastTime = video.currentTime;
  }, 120);

  // Keep retrying play() persistently — covers slow buffering on mobile
  // networks and any silently-failed autoplay attempts — WITHOUT ever
  // hiding the video, so it never needs a tap to start.
  const retryTimer = setInterval(function () {
    if (video.paused) attemptPlay();
  }, 700);

  ['touchstart', 'pointerdown', 'click'].forEach(function(evt) {
    document.addEventListener(evt, function retryPlay() {
      attemptPlay();
    }, { once: true, passive: true });
  });
})();

function enterSite() {
  const intro = document.getElementById('intro');
  const video = document.getElementById('bg-video');
  intro.style.transition = 'opacity 1.2s ease';
  video.style.transition = 'filter 1.2s ease';
  intro.style.opacity = '0';
  video.style.filter = 'brightness(0)';
  setTimeout(() => { window.location.href = 'home.html'; }, 1200);
}
</script>
